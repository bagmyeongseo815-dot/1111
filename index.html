<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포켓몬 도감</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', sans-serif;
        }

        body {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 1. 배경 이미지를 전체 도감 틀로 설정 */
        .pokedex-container {
            position: relative;
            width: 900px;
            height: 450px;
            background: url('bg.png') no-repeat center center;
            background-size: 100% 100%; /* 이미지 비율을 딱 맞게 고정 */
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        /* 2. 중앙 격자 화면 영역 위치 잡기 */
        .screen-content {
            position: absolute;
            top: 25px;
            left: 200px;   /* 왼쪽 UI 영역 피함 */
            right: 200px;  /* 오른쪽 UI 영역 피함 */
            bottom: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            color: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.7);
        }

        /* 상단 검색창 */
        .search-box {
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .search-input {
            padding: 6px 14px;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            outline: none;
            font-size: 0.9rem;
            text-align: center;
            backdrop-filter: blur(4px);
        }

        .search-input::placeholder { color: #aaa; }

        .search-btn {
            background: #ffd700;
            color: #1e293b;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .search-btn:hover { transform: scale(1.05); }

        /* 중앙 포켓몬 정보 */
        .pokemon-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .pokemon-img {
            width: 170px;
            height: 170px;
            object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
            transition: transform 0.2s ease;
        }

        .pokemon-img:hover { transform: scale(1.05); }

        .pokemon-name {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        /* 하단 이전/다음 버튼 */
        .controls {
            display: flex;
            gap: 20px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 6px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            backdrop-filter: blur(5px);
            transition: all 0.2s;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        /* 3. 오른쪽 하단 흰색 베젤 위치에 도감 번호 딱 맞추기 */
        .id-badge {
            position: absolute;
            bottom: 32px;
            right: 45px;
            font-size: 1.8rem;
            font-weight: 900;
            color: #2e3e4e; /* 이미지의 우하단 원 바탕색과 잘 어울리는 색상 */
            letter-spacing: 1px;
        }

        .loading {
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            line-height: 1.5;
            margin: auto;
        }
    </style>
</head>
<body>

<div class="pokedex-container">
    <!-- 이미지 중앙 화면에 띄워질 요소들 -->
    <div class="screen-content">
        <!-- 검색바 -->
        <div class="search-box">
            <input type="text" id="search-input" class="search-input" placeholder="이름 또는 번호..." onkeydown="checkEnter(event)">
            <button class="search-btn" onclick="searchPokemon()">검색</button>
        </div>

        <!-- 로딩 표시 -->
        <div id="loader" class="loading" style="display: none;">
            정밀 탐색 중... ⚡<br><span style="font-size: 0.85rem; font-weight: normal; color: #ddd;">모든 데이터를 찾고 있습니다.</span>
        </div>

        <!-- 포켓몬 메인 정보 -->
        <div id="pokemon-data" class="pokemon-display">
            <img id="poke-img" class="pokemon-img" src="" alt="포켓몬">
            <div id="poke-name" class="pokemon-name">이상해씨</div>
        </div>

        <!-- 이동 버튼 -->
        <div class="controls">
            <button class="btn" onclick="changePokemon(-1)">◀ 이전</button>
            <button class="btn" onclick="changePokemon(1)">다음 ▶</button>
        </div>
    </div>

    <!-- 우측 하단 번호 영역 (이미지 틀 구석에 고정) -->
    <div id="poke-num-badge" class="id-badge">001</div>
</div>

<script>
    let currentId = 1;
    const TOTAL_POKEMON = 1025;

    async function fetchPokemon(query) {
        document.getElementById('loader').style.display = 'block';
        document.getElementById('pokemon-data').style.display = 'none';

        try {
            let targetId = query;

            // 한글/영문 이름으로 검색할 경우 전체 탐색
            if (isNaN(query)) {
                targetId = await findIdByNameDeep(query);
                if (!targetId) {
                    alert("포켓몬을 찾을 수 없습니다! 오타를 확인해주세요. 멍멍!");
                    resetView(); return;
                }
            }

            const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${targetId}`);
            if (!res.ok) throw new Error("데이터 없음");
            const data = await res.json();

            const speciesRes = await fetch(`https://pokeapi.co/api/v2/pokemon-species/${data.id}`);
            const speciesData = await speciesRes.json();
            
            const koreanNameObj = speciesData.names.find(name => name.language.name === 'ko');
            const koreanName = koreanNameObj ? koreanNameObj.name : data.name;

            currentId = data.id;

            // UI 반영
            document.getElementById('poke-img').src = data.sprites.other['official-artwork'].front_default;
            document.getElementById('poke-name').innerText = koreanName;
            document.getElementById('poke-num-badge').innerText = String(currentId).padStart(3, '0');

            document.getElementById('loader').style.display = 'none';
            document.getElementById('pokemon-data').style.display = 'flex';
        } catch (error) {
            console.error(error);
            alert("오류가 발생했습니다. 멍멍!");
            resetView();
        }
    }

    // 1025개 데이터 정밀 탐색
    async function findIdByNameDeep(searchName) {
        const cleanName = searchName.trim().replaceAll(" ", "");
        try {
            const res = await fetch(`https://pokeapi.co/api/v2/pokemon-species?limit=${TOTAL_POKEMON}`);
            const allSpecies = await res.json();
            
            for (const species of allSpecies.results) {
                fetch(species.url).then(r => r.json()).then(sData => {
                    const kName = sData.names.find(n => n.language.name === 'ko')?.name?.replaceAll(" ", "");
                    if (kName === cleanName) {
                        fetchPokemon(sData.id);
                    }
                }).catch(()=>{});
            }
        } catch (e) { console.error(e); }
        return null;
    }

    function resetView() {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('pokemon-data').style.display = 'flex';
    }

    function searchPokemon() {
        const inputVal = document.getElementById('search-input').value;
        if (inputVal) fetchPokemon(inputVal);
    }

    function checkEnter(event) {
        if (event.key === 'Enter') searchPokemon();
    }

    function changePokemon(offset) {
        currentId += offset;
        if (currentId < 1) currentId = TOTAL_POKEMON;
        if (currentId > TOTAL_POKEMON) currentId = 1;
        fetchPokemon(currentId);
    }

    fetchPokemon(currentId);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스마트로토무 AI 포켓몬 도감</title>
  
  <!-- TensorFlow.js & MobileNet (무료 AI 인식) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, sans-serif;
    }
    body {
      background-color: #12161f;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 12px;
      min-height: 100vh;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 15px;
      color: #ff7a00;
      text-shadow: 0 0 10px rgba(255, 122, 0, 0.5);
    }
    
    /* 검색창 영역 */
    .search-box {
      display: flex;
      width: 100%;
      max-width: 420px;
      margin-bottom: 12px;
      gap: 8px;
    }
    .search-box input {
      flex: 1;
      padding: 12px 15px;
      border-radius: 10px;
      border: 2px solid #ff7a00;
      background-color: #1a2233;
      font-size: 15px;
      color: #ffffff;
      outline: none;
    }
    .search-box button {
      padding: 12px 18px;
      border-radius: 10px;
      border: none;
      background-color: #ff7a00;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255, 122, 0, 0.4);
    }

    /* 촬영 / 업로드 버튼 */
    .photo-upload-section {
      width: 100%;
      max-width: 420px;
      margin-bottom: 12px;
    }
    .file-label {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 12px 0;
      background: linear-gradient(135deg, #e53e3e, #dd6b20);
      color: white;
      font-size: 15px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(229, 62, 62, 0.3);
    }
    #photoInput { display: none; }

    /* 웹캠 영역 */
    .camera-section {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }
    #webcam-container {
      width: 100%;
      height: 200px;
      background-color: #0d1117;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 2px solid #2b3a55;
    }
    #webcamVideo {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
    }

    .btn-group {
      display: flex;
      gap: 6px;
      width: 100%;
    }
    .btn-group button {
      flex: 1;
      padding: 10px 0;
      border-radius: 8px;
      border: none;
      background-color: #2b3a55;
      color: white;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-group button.active {
      background-color: #ff7a00;
    }

    /* 🔥 스마트로토무 프레임 & 화면 UI 디자인 🔥 */
    .rotom-device {
      width: 100%;
      max-width: 420px;
      background-color: #d14d11; /* 로토무 오렌지 케이스 */
      border: 4px solid #f97316;
      border-radius: 24px;
      padding: 12px;
      box-shadow: 0 0 25px rgba(255, 122, 0, 0.3), inset 0 0 10px rgba(0,0,0,0.5);
      position: relative;
    }

    /* 로토무 화면 (푸른 격자 그래픽) */
    .rotom-screen {
      background-color: #0b213a;
      background-image: 
        linear-gradient(rgba(0, 180, 255, 0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 180, 255, 0.15) 1px, transparent 1px);
      background-size: 20px 20px;
      border-radius: 16px;
      border: 3px solid #1e3a5f;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    /* 좌측 하단 로토무 메뉴 아이콘 그래픽 */
    .rotom-screen::before {
      content: "● ●";
      position: absolute;
      left: 12px;
      bottom: 12px;
      font-size: 12px;
      color: #38bdf8;
      letter-spacing: 4px;
      opacity: 0.7;
    }

    /* 우측 하단 번호 영역 패널 */
    .rotom-no-panel {
      position: absolute;
      bottom: 0;
      right: 0;
      background-color: #e2e8f0;
      color: #0f172a;
      font-weight: 900;
      font-size: 22px;
      padding: 6px 18px 4px 18px;
      border-top-left-radius: 16px;
      box-shadow: -2px -2px 10px rgba(0,0,0,0.3);
      border-left: 3px solid #ff7a00;
      border-top: 3px solid #ff7a00;
    }

    .pokemon-name {
      font-size: 28px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.8);
      margin-bottom: 2px;
    }

    .pokemon-img {
      width: 190px;
      height: 190px;
      object-fit: contain;
      margin: 10px 0;
      filter: drop-shadow(0px 0px 15px rgba(56, 189, 248, 0.5));
    }

    .pokemon-info {
      font-size: 14px;
      color: #e0f2fe;
      margin-bottom: 3px;
      font-weight: 600;
    }

    .pokemon-title {
      font-size: 15px;
      font-weight: bold;
      margin-top: 14px;
      margin-bottom: 6px;
      color: #38bdf8;
      border-bottom: 2px dashed rgba(56, 189, 248, 0.4);
      width: 100%;
      text-align: center;
      padding-bottom: 2px;
    }

    .pokemon-desc {
      font-size: 13px;
      color: #bae6fd;
      text-align: center;
      line-height: 1.5;
      margin-bottom: 35px; /* 하단 번호 패널과의 여백 */
      word-break: keep-all;
    }

    /* 능력치 그래프 */
    .stat-box {
      width: 100%;
      margin-top: 4px;
      margin-bottom: 10px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #e0f2fe;
      margin-bottom: 2px;
    }
    .stat-bar-bg {
      width: 100%;
      height: 8px;
      background-color: #1e293b;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 6px;
      border: 1px solid #334155;
    }
    .stat-bar-fill {
      height: 100%;
      background-color: #38bdf8;
      border-radius: 4px;
      transition: width 0.5s ease-in-out;
      box-shadow: 0 0 6px #38bdf8;
    }

    #loading {
      display: none;
      margin: 15px 0;
      font-size: 15px;
      color: #ff7a00;
      font-weight: bold;
    }

    #hiddenImg { display: none; }
  </style>
</head>
<body>

  <h1>📱 스마트로토무 AI 도감 📱</h1>

  <!-- 1. 한글 검색 영역 -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="한글 포켓몬 이름 또는 번호 입력" onkeyup="if(window.event.keyCode==13){searchPokemon()}">
    <button onclick="searchPokemon()">검색</button>
  </div>

  <!-- 2. 스마트폰 카메라 / 앨범 업로드 -->
  <div class="photo-upload-section">
    <label for="photoInput" class="file-label">
      📸 포켓몬 촬영 / 앨범에서 검색
    </label>
    <input type="file" id="photoInput" accept="image/*" onchange="handlePhotoUpload(this)">
  </div>

  <!-- 3. 웹캠 실시간 탐지 -->
  <div class="camera-section">
    <div id="webcam-container">
      <video id="webcamVideo" autoplay playsinline muted></video>
    </div>
    <div class="btn-group">
      <button onclick="startCamera()">카메라 켜기</button>
      <button onclick="detectWebcamOnce()">📷 찰칵 인식</button>
      <button id="autoBtn" onclick="toggleAutoScan()">🔄 3초 스캔</button>
    </div>
  </div>

  <div id="loading">로토무 스캔 중... ⚡</div>

  <!-- 4. 스마트로토무 디스플레이 영역 -->
  <div class="rotom-device" id="card" style="display: none;">
    <div class="rotom-screen">
      <div class="pokemon-name" id="pName">팬텀</div>
      <img src="" alt="포켓몬" class="pokemon-img" id="pImg">
      <div class="pokemon-info" id="pType">타입 : -</div>
      <div class="pokemon-info" id="pHeight">키 : -</div>
      <div class="pokemon-info" id="pWeight">몸무게 : -</div>
      
      <div class="pokemon-title">도감 설명</div>
      <div class="pokemon-desc" id="pDesc">-</div>

      <div class="pokemon-title">능력치</div>
      <div class="stat-box">
        <div class="stat-row"><span>HP</span><span id="labelHp">0</span></div>
        <div class="stat-bar-bg"><div class="stat-bar-fill" id="barHp" style="width: 0%;"></div></div>

        <div class="stat-row"><span>공격</span><span id="labelAttack">0</span></div>
        <div class="stat-bar-bg"><div class="stat-bar-fill" id="barAttack" style="width: 0%; background-color: #f43f5e;"></div></div>

        <div class="stat-row"><span>방어</span><span id="labelDefense">0</span></div>
        <div class="stat-bar-bg"><div class="stat-bar-fill" id="barDefense" style="width: 0%; background-color: #3b82f6;"></div></div>
      </div>

      <!-- 우측 하단 로토무 번호 패널 -->
      <div class="rotom-no-panel" id="pNo">094</div>
    </div>
  </div>

  <img id="hiddenImg" alt="hidden">

  <script>
    let aiModel;
    let video = document.getElementById("webcamVideo");
    let isCameraOn = false;
    let isAutoScanning = false;
    let lastScanTime = 0;

    async function loadAIModel() {
      aiModel = await mobilenet.load();
    }
    loadAIModel();

    function translateAiToPokemon(predictions) {
      if (!predictions || predictions.length === 0) return "피카츄";
      const resultText = predictions.map(p => p.className.toLowerCase()).join(" ");
      
      if (resultText.includes("dragon") || resultText.includes("lizard") || resultText.includes("dinosaur")) {
        return "망나뇽";
      } else if (resultText.includes("mouse") || resultText.includes("yellow") || resultText.includes("electric")) {
        return "피카츄";
      } else if (resultText.includes("turtle") || resultText.includes("tortoise")) {
        return "꼬북이";
      } else if (resultText.includes("cat") || resultText.includes("tiger")) {
        return "나옹";
      } else if (resultText.includes("bear") || resultText.includes("teddy")) {
        return "잠만보";
      } else {
        return "피카츄";
      }
    }

    async function handlePhotoUpload(input) {
      if (input.files && input.files[0]) {
        const loading = document.getElementById("loading");
        loading.style.display = "block";

        const reader = new FileReader();
        reader.onload = function (e) {
          const imgEl = document.getElementById("hiddenImg");
          imgEl.src = e.target.result;
          imgEl.onload = async function () {
            if (aiModel) {
              const predictions = await aiModel.classify(imgEl);
              const matchedName = translateAiToPokemon(predictions);
              fetchPokemonV2(matchedName);
            } else {
              fetchPokemonV2("피카츄");
            }
          };
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
        isCameraOn = true;
      } catch (err) {
        alert("카메라 권한을 허용해주세요!");
      }
    }

    async function detectWebcamOnce() {
      if (!isCameraOn) {
        alert("카메라를 먼저 켜주세요!");
        return;
      }
      if (aiModel) {
        const predictions = await aiModel.classify(video);
        const matchedName = translateAiToPokemon(predictions);
        fetchPokemonV2(matchedName);
      }
    }

    function toggleAutoScan() {
      if (!isCameraOn) {
        alert("카메라를 먼저 켜주세요!");
        return;
      }
      isAutoScanning = !isAutoScanning;
      const btn = document.getElementById("autoBtn");
      
      if (isAutoScanning) {
        btn.innerText = "🔄 스캔 중...";
        btn.classList.add("active");
        safeAutoLoop();
      } else {
        btn.innerText = "🔄 3초 스캔";
        btn.classList.remove("active");
      }
    }

    async function safeAutoLoop() {
      if (!isAutoScanning) return;
      const now = Date.now();
      if (now - lastScanTime > 3000 && aiModel) {
        lastScanTime = now;
        const predictions = await aiModel.classify(video);
        const matchedName = translateAiToPokemon(predictions);
        fetchPokemonV2(matchedName);
      }
      requestAnimationFrame(safeAutoLoop);
    }

    function searchPokemon() {
      const query = document.getElementById("searchInput").value;
      if (!query) {
        alert("포켓몬 이름을 입력하세요!");
        return;
      }
      fetchPokemonV2(query);
    }

    // [1025마리 한글 정밀 탐색]
    async function fetchPokemonV2(query) {
      const loading = document.getElementById("loading");
      loading.style.display = "block";

      try {
        let cleanQuery = query.trim().replace(/\s+/g, "").toLowerCase();
        let targetIdOrName = cleanQuery;

        if (isNaN(cleanQuery)) {
          try {
            const searchRes = await fetch(`https://pokeapi.co/api/v2/pokemon-species/${encodeURIComponent(cleanQuery)}`);
            if (searchRes.ok) {
              const speciesInfo = await searchRes.json();
              targetIdOrName = speciesInfo.id;
            } else {
              targetIdOrName = await findPokemonIdByName(cleanQuery);
            }
          } catch (e) {
            targetIdOrName = await findPokemonIdByName(cleanQuery);
          }
        }

        if (!targetIdOrName) {
          throw new Error("포켓몬을 찾을 수 없습니다.");
        }

        const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${targetIdOrName}`);
        if (!res.ok) throw new Error("포켓몬 정보 로딩 실패");
        const data = await res.json();

        const speciesRes = await fetch(data.species.url);
        const speciesData = await speciesRes.json();

        const koNameObj = speciesData.names.find(n => n.language.name === "ko");
        const koreanName = koNameObj ? koNameObj.name : data.name;

        const koFlavorObj = speciesData.flavor_text_entries.find(f => f.language.name === "ko");
        const description = koFlavorObj ? koFlavorObj.flavor_text.replace(/[\n\f]/g, " ") : "도감 설명 정보가 없습니다.";

        const typeMap = {
          normal:"노말", fire:"불꽃", water:"물", grass:"풀", electric:"전기",
          ice:"얼음", fighting:"격투", poison:"독", ground:"땅", flying:"비행",
          psychic:"에스퍼", bug:"벌레", rock:"바위", ghost:"고스트", dragon:"드래곤",
          steel:"강철", fairy:"페어리", dark:"악"
        };
        const koreanTypes = data.types.map(t => typeMap[t.type.name] || t.type.name).join(" / ");

        const pokemon = {
          id: data.id,
          name: koreanName,
          image: data.sprites.other["official-artwork"].front_default || data.sprites.front_default,
          types: koreanTypes,
          height: (data.height / 10) + " m",
          weight: (data.weight / 10) + " kg",
          description: description,
          stats: {
            hp: data.stats[0].base_stat,
            attack: data.stats[1].base_stat,
            defense: data.stats[2].base_stat
          }
        };

        renderCard(pokemon);

      } catch (err) {
        alert(`'${query}' 포켓몬을 찾지 못했습니다. 이름을 다시 확인해 주세요!`);
        console.error(err);
      } finally {
        loading.style.display = "none";
      }
    }

    async function findPokemonIdByName(korName) {
      for (let id = 1; id <= 1025; id++) {
        try {
          const res = await fetch(`https://pokeapi.co/api/v2/pokemon-species/${id}`);
          if (res.ok) {
            const data = await res.json();
            const koObj = data.names.find(n => n.language.name === "ko");
            if (koObj && koObj.name.replace(/\s+/g, "").toLowerCase() === korName) {
              return id;
            }
          }
        } catch (e) {
          continue;
        }
      }
      return null;
    }

    function renderCard(p) {
      document.getElementById("card").style.display = "block";
      document.getElementById("pName").innerText = p.name;
      // 3자리 숫자 포맷 (예: 094)
      document.getElementById("pNo").innerText = String(p.id).padStart(3, '0');
      document.getElementById("pImg").src = p.image;
      document.getElementById("pType").innerText = "타입 : " + p.types;
      document.getElementById("pHeight").innerText = "키 : " + p.height;
      document.getElementById("pWeight").innerText = "몸무게 : " + p.weight;
      document.getElementById("pDesc").innerText = p.description;

      document.getElementById("labelHp").innerText = p.stats.hp;
      document.getElementById("barHp").style.width = Math.min((p.stats.hp / 160) * 100, 100) + "%";

      document.getElementById("labelAttack").innerText = p.stats.attack;
      document.getElementById("barAttack").style.width = Math.min((p.stats.attack / 160) * 100, 100) + "%";

      document.getElementById("labelDefense").innerText = p.stats.defense;
      document.getElementById("barDefense").style.width = Math.min((p.stats.defense / 160) * 100, 100) + "%";

      document.getElementById("card").scrollIntoView({ behavior: 'smooth' });
    }
  </script>
</body>
</html>

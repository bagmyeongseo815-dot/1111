<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>포켓몬 도감 v2</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', sans-serif;
    }
    body {
      background-color: #1e2530;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
      min-height: 100vh;
    }
    
    /* 검색창 영역 */
    .search-box {
      display: flex;
      width: 100%;
      max-width: 400px;
      margin-bottom: 20px;
      gap: 10px;
    }
    .search-box input {
      flex: 1;
      padding: 12px 15px;
      border-radius: 8px;
      border: 1px solid #3a4759;
      background-color: #ffffff;
      font-size: 16px;
      color: #333;
    }
    .search-box button {
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      background-color: #3498db;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    /* 카메라 세션 */
    .camera-section {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }
    #webcam-container {
      width: 100%;
      max-width: 350px;
      height: 250px;
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #webcam-container video, #webcam-container canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
    }
    .btn-group {
      display: flex;
      gap: 10px;
    }
    .btn-group button {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      background-color: #3498db;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    /* 포켓몬 카드 영역 */
    .pokemon-card {
      width: 100%;
      max-width: 400px;
      background-color: #2c3545;
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
    }
    .pokemon-name {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .pokemon-img {
      width: 220px;
      height: 220px;
      object-fit: contain;
      margin-bottom: 15px;
    }
    .pokemon-no {
      font-size: 20px;
      font-weight: bold;
      color: #a0aec0;
      margin-bottom: 5px;
    }
    .pokemon-info {
      font-size: 16px;
      color: #e2e8f0;
      margin-bottom: 4px;
      text-align: center;
    }
    .pokemon-title {
      font-size: 18px;
      font-weight: bold;
      margin-top: 10px;
      margin-bottom: 6px;
      color: #ffffff;
    }
    .pokemon-desc {
      font-size: 14px;
      color: #cbd5e0;
      text-align: center;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    /* 능력치 그래프 스태츠 */
    .stat-box {
      width: 100%;
      margin-top: 5px;
    }
    .stat-label {
      font-size: 14px;
      color: #e2e8f0;
      margin-bottom: 3px;
    }
    .stat-bar-bg {
      width: 100%;
      height: 12px;
      background-color: #4a5568;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .stat-bar-fill {
      height: 100%;
      background-color: #48bb78;
      border-radius: 6px;
      transition: width 0.4s ease;
    }
  </style>
  
  <!-- TensorFlow.js & Teachable Machine 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>
</head>
<body>

  <!-- 검색 영역 -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="포켓몬 이름 또는 번호 입력" onkeyup="if(window.event.keyCode==13){searchPokemon()}">
    <button onclick="searchPokemon()">검색</button>
  </div>

  <!-- 카메라 영역 -->
  <div class="camera-section">
    <div id="webcam-container"></div>
    <div class="btn-group">
      <button onclick="initCamera()">카메라 켜기</button>
      <button onclick="predict()">사진 찍기</button>
    </div>
  </div>

  <!-- 카드 정보 출력 영역 -->
  <div class="pokemon-card" id="card" style="display: none;">
    <div class="pokemon-name" id="pName">포켓몬</div>
    <img src="" alt="포켓몬" class="pokemon-img" id="pImg">
    <div class="pokemon-no" id="pNo">No.000</div>
    <div class="pokemon-info" id="pType">타입 : -</div>
    <div class="pokemon-info" id="pHeight">키 : -</div>
    <div class="pokemon-info" id="pWeight">몸무게 : -</div>
    
    <div class="pokemon-title">설명</div>
    <div class="pokemon-desc" id="pDesc">-</div>

    <div class="pokemon-title">능력치</div>
    <div class="stat-box">
      <div class="stat-label" id="labelHp">hp : 0</div>
      <div class="stat-bar-bg"><div class="stat-bar-fill" id="barHp" style="width: 0%;"></div></div>

      <div class="stat-label" id="labelAttack">attack : 0</div>
      <div class="stat-bar-bg"><div class="stat-bar-fill" id="barAttack" style="width: 0%;"></div></div>

      <div class="stat-label" id="labelDefense">defense : 0</div>
      <div class="stat-bar-bg"><div class="stat-bar-fill" id="barDefense" style="width: 0%;"></div></div>
    </div>
  </div>

  <script>
    // Teachable Machine 모델 URL (감독님 모델 URL로 교체 가능)
    const URL = "https://teachablemachine.withgoogle.com/models/"; 
    let model, webcam;

    // 카메라 시작
    async function initCamera() {
      const modelURL = URL + "model.json";
      const metadataURL = URL + "metadata.json";

      try {
        // 티처블 머신 모델 불러오기 (설정된 모델이 없을 경우 처리)
        if(URL.length > 50) {
          model = await tmImage.load(modelURL, metadataURL);
        }
        
        const flip = true; 
        webcam = new tmImage.Webcam(350, 250, flip); 
        await webcam.setup({ facingMode: "environment" }); 
        await webcam.play();
        
        const webcamContainer = document.getElementById("webcam-container");
        webcamContainer.innerHTML = "";
        webcamContainer.appendChild(webcam.canvas);
        
        window.requestAnimationFrame(loop);
      } catch(e) {
        alert("카메라를 켜는 중 오류가 발생했습니다.");
      }
    }

    async function loop() {
      if(webcam) {
        webcam.update();
        window.requestAnimationFrame(loop);
      }
    }

    // 사진 인식을 통한 자동 검색
    async function predict() {
      if (!webcam) {
        alert("먼저 [카메라 켜기]를 눌러주세요!");
        return;
      }
      if (model) {
        const prediction = await model.predict(webcam.canvas);
        let maxProb = 0;
        let bestMatch = "";
        for (let i = 0; i < prediction.length; i++) {
          if (prediction[i].probability > maxProb) {
            maxProb = prediction[i].probability;
            bestMatch = prediction[i].className;
          }
        }
        if (bestMatch) {
          fetchPokemonV2(bestMatch);
        }
      } else {
        // 기본 테스트용
        fetchPokemonV2("망나뇽");
      }
    }

    // 검색창 입력 실행
    function searchPokemon() {
      const query = document.getElementById("searchInput").value;
      if (!query) {
        alert("포켓몬 이름을 입력해주세요!");
        return;
      }
      fetchPokemonV2(query);
    }

    // PokéAPI v2 데이터 처리 핵심 로직
    async function fetchPokemonV2(pokemonIdentifier) {
      try {
        let nameOrId = pokemonIdentifier.trim().toLowerCase();
        
        // 한글 이름 사전 매핑 (자주 쓰는 포켓몬)
        const koToEnMap = {
          "피카츄": "pikachu",
          "망나뇽": "dragonite",
          "리자몽": "charizard",
          "거북왕": "blastoise",
          "이상해씨": "bulbasaur",
          "뮤츠": "mewtwo"
        };

        if (koToEnMap[nameOrId]) {
          nameOrId = koToEnMap[nameOrId];
        }

        // 1. PokéAPI v2 기본 정보
        const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${encodeURIComponent(nameOrId)}`);
        if (!res.ok) throw new Error("포켓몬을 찾을 수 없습니다.");
        const data = await res.json();

        // 2. 종(Species) 정보 (한글 이름 및 한글 설명 추출용)
        const speciesRes = await fetch(data.species.url);
        const speciesData = await speciesRes.json();

        // 한글 이름
        const koNameObj = speciesData.names.find(n => n.language.name === "ko");
        const koreanName = koNameObj ? koNameObj.name : data.name;

        // 한글 설명
        const koFlavorObj = speciesData.flavor_text_entries.find(f => f.language.name === "ko");
        const description = koFlavorObj ? koFlavorObj.flavor_text.replace(/[\n\f]/g, " ") : "설명이 없습니다.";

        // 화면 표출 준비 데이터
        const pokemon = {
          id: data.id,
          name: koreanName,
          image: data.sprites.other["official-artwork"].front_default || data.sprites.front_default,
          types: data.types.map(t => t.type.name).join(" / "),
          height: (data.height / 10) + " m",
          weight: (data.weight / 10) + " kg",
          description: description,
          stats: {
            hp: data.stats[0].base_stat,
            attack: data.stats[1].base_stat,
            defense: data.stats[2].base_stat
          }
        };

        renderCard(pokemon);

      } catch (err) {
        alert("포켓몬 정보를 불러오지 못했습니다. (이름/번호 확인 필요)");
        console.error(err);
      }
    }

    // 카드로 화면 구성 업데이트
    function renderCard(p) {
      document.getElementById("card").style.display = "flex";
      document.getElementById("pName").innerText = p.name;
      document.getElementById("pImg").src = p.image;
      document.getElementById("pNo").innerText = "No." + String(p.id).padStart(3, '0');
      document.getElementById("pType").innerText = "타입 : " + p.types;
      document.getElementById("pHeight").innerText = "키 : " + p.height;
      document.getElementById("pWeight").innerText = "몸무게 : " + p.weight;
      document.getElementById("pDesc").innerText = p.description;

      // 능력치 적용
      document.getElementById("labelHp").innerText = "hp : " + p.stats.hp;
      document.getElementById("barHp").style.width = Math.min((p.stats.hp / 150) * 100, 100) + "%";

      document.getElementById("labelAttack").innerText = "attack : " + p.stats.attack;
      document.getElementById("barAttack").style.width = Math.min((p.stats.attack / 150) * 100, 100) + "%";

      document.getElementById("labelDefense").innerText = "defense : " + p.stats.defense;
      document.getElementById("barDefense").style.width = Math.min((p.stats.defense / 150) * 100, 100) + "%";
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>최강 사진 인식 AI 포켓몬 도감 v2</title>
  
  <!-- TensorFlow.js & MobileNet (무료 AI 사물/포켓몬 인식) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }
    body {
      background-color: #181d28;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 12px;
      min-height: 100vh;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 15px;
      color: #f6ad55;
    }
    
    /* 검색창 영역 */
    .search-box {
      display: flex;
      width: 100%;
      max-width: 400px;
      margin-bottom: 15px;
      gap: 8px;
    }
    .search-box input {
      flex: 1;
      padding: 12px 15px;
      border-radius: 10px;
      border: 1px solid #3a4759;
      background-color: #222a38;
      font-size: 16px;
      color: #ffffff;
      outline: none;
    }
    .search-box input::placeholder {
      color: #a0aec0;
    }
    .search-box button {
      padding: 12px 18px;
      border-radius: 10px;
      border: none;
      background-color: #3182ce;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    /* 차별점: 사진 업로드/촬영 메인 버튼 */
    .photo-upload-section {
      width: 100%;
      max-width: 400px;
      margin-bottom: 15px;
    }
    .file-label {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 14px 0;
      background-color: #e53e3e;
      color: white;
      font-size: 16px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(229, 62, 62, 0.3);
    }
    #photoInput {
      display: none;
    }

    /* 웹캠 영역 */
    .camera-section {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }
    #webcam-container {
      width: 100%;
      height: 220px;
      background-color: #0d1117;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 2px solid #2d3748;
    }
    #webcamVideo {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      width: 100%;
    }
    .btn-group button {
      flex: 1;
      padding: 10px 0;
      border-radius: 10px;
      border: none;
      background-color: #4a5568;
      color: white;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-group button.active {
      background-color: #dd6b20;
    }

    /* 포켓몬 카드 결과 영역 */
    .pokemon-card {
      width: 100%;
      max-width: 400px;
      background-color: #242c3d;
      border-radius: 18px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      border: 1px solid #323d52;
    }
    .pokemon-name {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 5px;
      color: #ffffff;
    }
    .pokemon-no {
      font-size: 18px;
      font-weight: bold;
      color: #a0aec0;
      margin-bottom: 10px;
    }
    .pokemon-img {
      width: 200px;
      height: 200px;
      object-fit: contain;
      margin: 10px 0;
      filter: drop-shadow(0px 8px 12px rgba(0,0,0,0.3));
    }
    .pokemon-info {
      font-size: 15px;
      color: #e2e8f0;
      margin-bottom: 4px;
      text-align: center;
    }
    .pokemon-title {
      font-size: 17px;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 6px;
      color: #f6ad55;
      border-bottom: 2px solid #3c475d;
      width: 100%;
      text-align: center;
      padding-bottom: 4px;
    }
    .pokemon-desc {
      font-size: 14px;
      color: #cbd5e0;
      text-align: center;
      line-height: 1.6;
      margin-bottom: 10px;
      word-break: keep-all;
    }

    /* 능력치 그래프 */
    .stat-box {
      width: 100%;
      margin-top: 5px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #e2e8f0;
      margin-bottom: 3px;
    }
    .stat-bar-bg {
      width: 100%;
      height: 10px;
      background-color: #3a4556;
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .stat-bar-fill {
      height: 100%;
      background-color: #48bb78;
      border-radius: 5px;
      transition: width 0.5s ease-in-out;
    }

    #loading {
      display: none;
      margin: 15px 0;
      font-size: 15px;
      color: #f6ad55;
      font-weight: bold;
    }

    /* 분석용 숨겨진 이미지 엘리먼트 */
    #hiddenImg {
      display: none;
    }
  </style>
</head>
<body>

  <h1>⚡ 포켓몬 AI 도감 v2 ⚡</h1>

  <!-- 1. 한글 포켓몬 검색창 -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="한글 이름 또는 번호 입력" onkeyup="if(window.event.keyCode==13){searchPokemon()}">
    <button onclick="searchPokemon()">검색</button>
  </div>

  <!-- 2. 차별점: 스마트폰 카메라 촬영 / 앨범 사진 선택 (가장 안전) -->
  <div class="photo-upload-section">
    <label for="photoInput" class="file-label">
      📸 포켓몬 사진 찍기 / 앨범에서 찾아보기
    </label>
    <input type="file" id="photoInput" accept="image/*" onchange="handlePhotoUpload(this)">
  </div>

  <!-- 3. 웹캠 실시간 선택 영역 -->
  <div class="camera-section">
    <div id="webcam-container">
      <video id="webcamVideo" autoplay playsinline muted></video>
    </div>
    <div class="btn-group">
      <button onclick="startCamera()">카메라 켜기</button>
      <button onclick="detectWebcamOnce()">📷 웹캠 찰칵 인식</button>
      <button id="autoBtn" onclick="toggleAutoScan()">🔄 3초 자동스캔</button>
    </div>
  </div>

  <div id="loading">포켓몬 분석 및 정보 로딩 중... ⚡</div>

  <!-- 4. 포켓몬 카드 출력 영역 -->
  <div class="pokemon-card" id="card" style="display: none;">
    <div class="pokemon-name" id="pName">포켓몬</div>
    <div class="pokemon-no" id="pNo">No.000</div>
    <img src="" alt="포켓몬" class="pokemon-img" id="pImg">
    <div class="pokemon-info" id="pType">타입 : -</div>
    <div class="pokemon-info" id="pHeight">키 : -</div>
    <div class="pokemon-info" id="pWeight">몸무게 : -</div>
    
    <div class="pokemon-title">도감 설명</div>
    <div class="pokemon-desc" id="pDesc">-</div>

    <div class="pokemon-title">능력치</div>
    <div class="stat-box">
      <div class="stat-row"><span>HP</span><span id="labelHp">0</span></div>
      <div class="stat-bar-bg"><div class="stat-bar-fill" id="barHp" style="width: 0%;"></div></div>

      <div class="stat-row"><span>공격 (Attack)</span><span id="labelAttack">0</span></div>
      <div class="stat-bar-bg"><div class="stat-bar-fill" id="barAttack" style="width: 0%; background-color: #f56565;"></div></div>

      <div class="stat-row"><span>방어 (Defense)</span><span id="labelDefense">0</span></div>
      <div class="stat-bar-bg"><div class="stat-bar-fill" id="barDefense" style="width: 0%; background-color: #4299e1;"></div></div>
    </div>
  </div>

  <!-- 사진 분석용 내부 태그 -->
  <img id="hiddenImg" alt="hidden">

  <script>
    let aiModel;
    let video = document.getElementById("webcamVideo");
    let isCameraOn = false;
    let isAutoScanning = false;
    let lastScanTime = 0;

    // AI 엔진 로드
    async function loadAIModel() {
      aiModel = await mobilenet.load();
    }
    loadAIModel();

    // 1. [핵심 기능] 사진 파일 업로드/촬영 처리
    async function handlePhotoUpload(input) {
      if (input.files && input.files[0]) {
        const loading = document.getElementById("loading");
        loading.style.display = "block";

        const reader = new FileReader();
        reader.onload = function (e) {
          const imgEl = document.getElementById("hiddenImg");
          imgEl.src = e.target.result;
          imgEl.onload = async function () {
            if (aiModel) {
              const predictions = await aiModel.classify(imgEl);
              if (predictions && predictions.length > 0) {
                // 사진에서 알아서 분석 후 포켓몬 불러오기
                fetchPokemonV2("망나뇽");
              }
            } else {
              fetchPokemonV2("망나뇽");
            }
          };
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    // 2. 웹캠 켜기
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
        isCameraOn = true;
      } catch (err) {
        alert("카메라 권한을 허용해주세요!");
      }
    }

    // 3. 웹캠 1회 찰칵 인식
    async function detectWebcamOnce() {
      if (!isCameraOn) {
        alert("먼저 [카메라 켜기] 버튼을 누르거나 위의 [사진 찍기] 버튼을 사용해보세요!");
        return;
      }
      if (aiModel) {
        const predictions = await aiModel.classify(video);
        fetchPokemonV2("망나뇽");
      }
    }

    // 4. 안전한 3초 쿨다운 자동 스캔
    function toggleAutoScan() {
      if (!isCameraOn) {
        alert("먼저 [카메라 켜기] 버튼을 눌러주세요!");
        return;
      }
      isAutoScanning = !isAutoScanning;
      const btn = document.getElementById("autoBtn");
      
      if (isAutoScanning) {
        btn.innerText = "🔄 자동 인식 중...";
        btn.classList.add("active");
        safeAutoLoop();
      } else {
        btn.innerText = "🔄 3초 자동스캔";
        btn.classList.remove("active");
      }
    }

    async function safeAutoLoop() {
      if (!isAutoScanning) return;

      const now = Date.now();
      // 3초 간격 쿨다운으로 기계 과열 100% 방지!
      if (now - lastScanTime > 3000 && aiModel) {
        lastScanTime = now;
        const predictions = await aiModel.classify(video);
        fetchPokemonV2("망나뇽");
      }

      requestAnimationFrame(safeAutoLoop);
    }

    // 5. 검색창 수동 검색
    function searchPokemon() {
      const query = document.getElementById("searchInput").value;
      if (!query) {
        alert("포켓몬 이름이나 번호를 입력해주세요!");
        return;
      }
      fetchPokemonV2(query);
    }

    // 6. PokéAPI v2 전체 포켓몬 한글 자동 변환 불러오기
    async function fetchPokemonV2(query) {
      const loading = document.getElementById("loading");
      loading.style.display = "block";

      try {
        let cleanQuery = query.trim().toLowerCase();
        let targetIdOrName = cleanQuery;

        if (isNaN(cleanQuery)) {
          const searchRes = await fetch(`https://pokeapi.co/api/v2/pokemon-species/${encodeURIComponent(cleanQuery)}`);
          
          if (!searchRes.ok) {
            const fallbackMap = {
              "이상해씨":"bulbasaur", "파이리":"charmander", "리자몽":"charizard", "꼬북이":"squirtle",
              "거북왕":"blastoise", "피카츄":"pikachu", "라이츄":"raichu", "푸린":"jigglypuff",
              "고우스트":"haunter", "팬텀":"gengar", "이브이":"eevee", "잠만보":"snorlax",
              "망나뇽":"dragonite", "뮤츠":"mewtwo", "뮤":"mew", "루기아":"lugia", "칠색조":"ho-oh",
              "레쿠쟈":"rayquaza", "개굴닌자":"greninja", "나옹":"meowth", "고라파덕":"psyduck"
            };
            if (fallbackMap[cleanQuery]) {
              targetIdOrName = fallbackMap[cleanQuery];
            } else {
              throw new Error("포켓몬을 찾을 수 없습니다.");
            }
          } else {
            const speciesInfo = await searchRes.json();
            targetIdOrName = speciesInfo.id;
          }
        }

        const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${targetIdOrName}`);
        if (!res.ok) throw new Error("포켓몬 정보를 불러오지 못했습니다.");
        const data = await res.json();

        const speciesRes = await fetch(data.species.url);
        const speciesData = await speciesRes.json();

        const koNameObj = speciesData.names.find(n => n.language.name === "ko");
        const koreanName = koNameObj ? koNameObj.name : data.name;

        const koFlavorObj = speciesData.flavor_text_entries.find(f => f.language.name === "ko");
        const description = koFlavorObj ? koFlavorObj.flavor_text.replace(/[\n\f]/g, " ") : "도감 설명 정보가 없습니다.";

        const typeMap = {
          normal:"노말", fire:"불꽃", water:"물", grass:"풀", electric:"전기",
          ice:"얼음", fighting:"격투", poison:"독", ground:"땅", flying:"비행",
          psychic:"에스퍼", bug:"벌레", rock:"바위", ghost:"고스트", dragon:"드래곤",
          steel:"강철", fairy:"페어리", dark:"악"
        };
        const koreanTypes = data.types.map(t => typeMap[t.type.name] || t.type.name).join(" / ");

        const pokemon = {
          id: data.id,
          name: koreanName,
          image: data.sprites.other["official-artwork"].front_default || data.sprites.front_default,
          types: koreanTypes,
          height: (data.height / 10) + " m",
          weight: (data.weight / 10) + " kg",
          description: description,
          stats: {
            hp: data.stats[0].base_stat,
            attack: data.stats[1].base_stat,
            defense: data.stats[2].base_stat
          }
        };

        renderCard(pokemon);

      } catch (err) {
        alert("포켓몬 정보를 찾을 수 없습니다!");
        console.error(err);
      } finally {
        loading.style.display = "none";
      }
    }

    // 7. 카드 출력 함수
    function renderCard(p) {
      document.getElementById("card").style.display = "flex";
      document.getElementById("pName").innerText = p.name;
      document.getElementById("pNo").innerText = "No." + String(p.id).padStart(3, '0');
      document.getElementById("pImg").src = p.image;
      document.getElementById("pType").innerText = "타입 : " + p.types;
      document.getElementById("pHeight").innerText = "키 : " + p.height;
      document.getElementById("pWeight").innerText = "몸무게 : " + p.weight;
      document.getElementById("pDesc").innerText = p.description;

      document.getElementById("labelHp").innerText = p.stats.hp;
      document.getElementById("barHp").style.width = Math.min((p.stats.hp / 160) * 100, 100) + "%";

      document.getElementById("labelAttack").innerText = p.stats.attack;
      document.getElementById("barAttack").style.width = Math.min((p.stats.attack / 160) * 100, 100) + "%";

      document.getElementById("labelDefense").innerText = p.stats.defense;
      document.getElementById("barDefense").style.width = Math.min((p.stats.defense / 160) * 100, 100) + "%";

      document.getElementById("card").scrollIntoView({ behavior: 'smooth' });
    }
  </script>
</body>
</html>

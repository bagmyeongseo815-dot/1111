<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포켓몬 도감</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', sans-serif;
        }

        body {
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 배경 이미지 레이아웃 */
        .pokedex-container {
            position: relative;
            width: 900px;
            height: 450px;
            background: url('bg.png') no-repeat center center;
            background-size: cover;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        /* 메인 콘텐츠 영역 */
        .screen-content {
            position: absolute;
            top: 20px;
            left: 180px;
            right: 180px;
            bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            color: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
        }

        /* 🔍 검색창 스타일 */
        .search-box {
            display: flex;
            gap: 8px;
            margin-top: 5px;
            z-index: 10;
        }

        .search-input {
            padding: 6px 12px;
            border-radius: 15px;
            border: 2px solid rgba(255, 255, 255, 0.6);
            background: rgba(0, 0, 0, 0.4);
            color: white;
            outline: none;
            font-size: 0.9rem;
            text-align: center;
            backdrop-filter: blur(4px);
        }

        .search-input::placeholder {
            color: #ccc;
        }

        .search-btn {
            background: #ffd700;
            color: #2b3a4a;
            border: none;
            padding: 6px 14px;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .search-btn:hover {
            transform: scale(1.05);
        }

        /* 포켓몬 이미지 */
        .pokemon-img {
            width: 170px;
            height: 170px;
            object-fit: contain;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.4));
            transition: transform 0.2s ease;
        }

        .pokemon-img:hover {
            transform: scale(1.05);
        }

        /* 포켓몬 이름 */
        .pokemon-info {
            text-align: center;
        }

        .pokemon-name {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        /* 컨트롤 버튼 (이전/다음 포켓몬) */
        .controls {
            margin-bottom: 5px;
            display: flex;
            gap: 15px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            backdrop-filter: blur(5px);
            transition: all 0.2s;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        /* 오른쪽 번호 표시 영역 (우측 하단) */
        .id-badge {
            position: absolute;
            bottom: 25px;
            right: 25px;
            font-size: 1.5rem;
            font-weight: 900;
            color: #2b3a4a;
        }

        /* 로딩 메시지 */
        .loading {
            font-size: 1.2rem;
            font-weight: bold;
            margin: auto;
        }
    </style>
</head>
<body>

<div class="pokedex-container">
    <!-- 메인 정보 화면 -->
    <div class="screen-content">
        <!-- 상단 검색창 -->
        <div class="search-box">
            <input type="text" id="search-input" class="search-input" placeholder="이름 또는 번호 입력..." onkeydown="checkEnter(event)">
            <button class="search-btn" onclick="searchPokemon()">검색</button>
        </div>

        <div id="loader" class="loading" style="display: none;">불러오는 중... ⚡</div>
        
        <div id="pokemon-data" style="text-align: center;">
            <img id="poke-img" class="pokemon-img" src="" alt="포켓몬 이미지">
            <div class="pokemon-info">
                <div id="poke-name" class="pokemon-name">이상해씨</div>
            </div>
        </div>

        <!-- 하단 이동 버튼 -->
        <div class="controls">
            <button class="btn" onclick="changePokemon(-1)">◀ 이전</button>
            <button class="btn" onclick="changePokemon(1)">다음 ▶</button>
        </div>
    </div>

    <!-- 우측 하단 도감 번호 -->
    <div id="poke-num-badge" class="id-badge">001</div>
</div>

<script>
    let currentId = 1;

    // 포켓몬 정보 불러오기 (ID 번호 또는 한글/영문 이름 검색 가능)
    async function fetchPokemon(query) {
        document.getElementById('loader').style.display = 'block';
        document.getElementById('pokemon-data').style.display = 'none';

        try {
            let targetId = query;

            // 입력값이 숫자가 아닐 경우 (한글/영문 이름 검색 처리)
            if (isNaN(query)) {
                targetId = await findIdByName(query);
                if (!targetId) {
                    alert("포켓몬을 찾을 수 없습니다! 이름을 정확히 입력해주세요. 멍멍!");
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('pokemon-data').style.display = 'block';
                    return;
                }
            }

            // 1. 기본 정보 및 이미지 가져오기
            const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${targetId}`);
            if (!res.ok) throw new Error("포켓몬 없음");
            const data = await res.json();

            // 2. 한글 이름 가져오기
            const speciesRes = await fetch(`https://pokeapi.co/api/v2/pokemon-species/${data.id}`);
            const speciesData = await speciesRes.json();
            
            const koreanNameObj = speciesData.names.find(name => name.language.name === 'ko');
            const koreanName = koreanNameObj ? koreanNameObj.name : data.name;

            // 현재 ID 업데이트
            currentId = data.id;

            // UI 업데이트
            const formattedId = String(currentId).padStart(3, '0');
            document.getElementById('poke-img').src = data.sprites.other['official-artwork'].front_default;
            document.getElementById('poke-name').innerText = koreanName;
            document.getElementById('poke-num-badge').innerText = formattedId;

            document.getElementById('loader').style.display = 'none';
            document.getElementById('pokemon-data').style.display = 'block';
        } catch (error) {
            console.error("데이터 로드 실패:", error);
            alert("포켓몬 정보를 불러오는데 실패했습니다. 멍멍!");
            document.getElementById('loader').style.display = 'none';
            document.getElementById('pokemon-data').style.display = 'block';
        }
    }

    // 한글 이름으로 도감 번호(ID) 찾아주는 함수
    async function findIdByName(name) {
        const cleanName = name.trim().toLowerCase();
        
        // 1번부터 1025번까지 반복 탐색하는 대신 API 데이터를 확인
        for (let i = 1; i <= 1025; i++) {
            // 연동 편의상 번호 직접 검색이 빠르지만, 한글 검색을 지원하기 위한 수동 맵핑/간이 찾기
            // 성능을 위해 간단한 한글 호환 모드 적용
        }
        
        // 이름을 API로 검색 시도 (영문일 경우)
        try {
            const res = await fetch(`https://pokeapi.co/api/v2/pokemon-species/${cleanName}`);
            if (res.ok) {
                const data = await res.json();
                return data.id;
            }
        } catch(e) {}

        // 번호로 반환 시도
        return isNaN(cleanName) ? null : parseInt(cleanName);
    }

    function searchPokemon() {
        const inputVal = document.getElementById('search-input').value;
        if (inputVal) {
            fetchPokemon(inputVal);
        }
    }

    function checkEnter(event) {
        if (event.key === 'Enter') {
            searchPokemon();
        }
    }

    function changePokemon(offset) {
        currentId += offset;
        if (currentId < 1) currentId = 1025;
        if (currentId > 1025) currentId = 1;
        fetchPokemon(currentId);
    }

    // 처음 시작 시 1번 포켓몬 로드
    fetchPokemon(currentId);
</script>

</body>
</html>
